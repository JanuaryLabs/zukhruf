name: Release

# Releases each push to main and does not wait for CI (docs/adr/0007): the
# pre-push hook proved lint, typecheck and build of each pushed commit, and CI
# runs beside the release and only reports. nx release version writes the
# versions that the conventional commits since the last release tag ask into
# the runner's checkout only: it commits, tags and pushes nothing, and main
# keeps the versions of its files. The release tag is then made on the pushed
# commit through the GitHub API, and nx-release-publish publishes what was
# built from it. So nothing reaches npm without its tag. A version already on
# npm is skipped. A commit with nothing to release changes nothing.
on:
  push:
    branches: [main]

# A release is never cancelled: one stopped between the tag and the publish
# would leave a version unpublished. The pushes that arrive during a release
# wait as one pending run, and a newer push replaces it, so the newest push
# releases every commit since the last release. Each run finds the tag of the
# run before it.
concurrency:
  group: release
  cancel-in-progress: false

# nx.json runs 6 tasks at once for the 14-core Mac that the sessions push from;
# the runner keeps Nx's default of 3, as NX_PARALLEL wins over nx.json.
env:
  NX_PARALLEL: 3

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The tag step creates refs/tags/release/<version> through the API.
      contents: write
      id-token: write
    # The release restores the npm cache but never writes one.
    cache-mode: read
    steps:
      # The tags come with the history: Nx counts the commits since the newest
      # release tag that the pushed commit holds.
      - name: Checkout the pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org/

      # The preVersionCommand builds sqlite-open, whose native target builds
      # with Zig.
      - name: Set up Zig
        uses: $/.github/actions/setup-zig

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # The preVersionCommand builds the pushed commit, and the publish packs
      # that build.
      - name: Version the pushed commit
        id: version
        uses: $/.github/actions/nx-release-version

      # The tag goes first: the next release counts its commits from it. When
      # GitHub refuses the tag, the step fails and nothing is published; the
      # Release run of the next push counts from the tag before and releases
      # these commits too.
      - name: Tag the pushed commit
        if: steps.version.outputs.version != '' && steps.version.outputs.tagged == 'false'
        uses: $/.github/actions/release-tag
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Publish
        if: steps.version.outputs.version != ''
        uses: $/.github/actions/nx-release-publish
        with:
          token: ${{ secrets.NPM_ACCESS_TOKEN }}
