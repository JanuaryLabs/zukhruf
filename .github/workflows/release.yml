name: Release

# Releases the commit that CI tested, once CI is green for it, even when main
# has moved on since: nx release version versions it with what its conventional
# commits since the last release ask, commits on top of it and tags that commit,
# the tag is pushed, nx-release-publish publishes what was built from it, and
# then the main job merges the release commit into main as main is then. So
# nothing untested reaches npm, and nothing reaches npm without its tag. A
# version already on npm is skipped. A commit with nothing to release, or one
# that an earlier release holds, changes nothing. The tag and the merge are
# pushed with GITHUB_TOKEN, which starts no further workflow run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# A release is never cancelled: one stopped between the tag and the publish
# would leave a version unpublished. Every run waits its turn, in the order CI
# finished, so each run finds the tag and the merge of the run before it.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

# nx.json runs 6 tasks at once for the 14-core Mac that the sessions push from;
# the runner keeps Nx's default of 3, as NX_PARALLEL wins over nx.json.
env:
  NX_PARALLEL: 3

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # The release restores the npm cache but never writes one.
    cache-mode: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      # The release job pushes the tag with these credentials.
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org/

      - name: Set up Zig
        uses: $/.github/actions/setup-zig

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # The tested commit may not hold the merge of the previous release yet,
      # when it was pushed while that release ran, so the newest release tag is
      # looked up among all tags and not only those HEAD reaches; Nx then counts
      # the commits from that tag to HEAD. With no such commits Nx changes
      # nothing: the newest release holds the tested commit, as when an older
      # run is run again. The preVersionCommand builds the tested commit, and
      # the publish packs that build.
      - name: Version the tested commit
        id: version
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          # nx release runs here through its Node API, not npx, so the shell
          # that runs the preVersionCommand needs node_modules/.bin on PATH
          # to find nx ("/bin/sh: nx: not found" in run 44767683501).
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --input-type=module - <<'EOF'
          import { ReleaseClient } from 'nx/release';

          await new ReleaseClient({
            releaseTag: { checkAllBranchesWhen: true },
          }).releaseVersion({ gitPush: false });
          EOF
          if [ "$(git rev-parse HEAD)" = "$TESTED" ]; then
            tag="$(git -c versionsort.suffix=- for-each-ref --sort=-v:refname --count=1 --format='%(refname:strip=2)' 'refs/tags/release/*')"
            if [ -z "$tag" ] || [ "$(git rev-parse "$tag^{commit}^1")" != "$TESTED" ]; then
              echo "The newest release holds $TESTED, so there is nothing to release."
              exit 0
            fi
            # A run of this commit tagged it and stopped before the end (#4692).
            # Its tree is the tested commit with the versions, and the build of
            # the tested commit is in place: dist is not in git.
            echo "$tag was made for $TESTED; this run finishes its release."
            git checkout --detach "$tag"
          fi
          tag="$(git describe --exact-match --match 'release/*' HEAD)"
          echo "version=${tag#release/}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The tag goes first: the next release counts its commits from it, so a
      # version reaches npm only once its tag is there.
      - name: Push the tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push origin "refs/tags/release/$VERSION"

      - name: Publish
        if: steps.version.outputs.version != ''
        uses: $/.github/actions/nx-release-publish
        with:
          token: ${{ secrets.NPM_ACCESS_TOKEN }}

  # Main gets the version as a merge of the release commit, so the tag is in
  # main's history. The merge takes main's tree and writes the version into it
  # with Nx; a textual merge of the release commit would conflict on every
  # version line whenever the tested commit lacks the previous release's merge.
  # A push to main in the meantime rejects the merge, and the job builds it
  # again on the new main.
  main:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    cache-mode: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE: ${{ needs.release.outputs.commit }}
    steps:
      # The main job pushes the merge with these credentials.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      # The version is written without the preVersionCommand: nothing is built
      # or published from main.
      - name: Merge the release into main
        run: |
          # nx release runs here through its Node API, not npx, so a command
          # it spawns finds the workspace's tools only with node_modules/.bin
          # on PATH, as the release job's version step does.
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for _ in 1 2 3 4 5; do
            git fetch origin main
            git checkout --force --detach origin/main
            if git merge-base --is-ancestor "$RELEASE" HEAD; then
              echo "main holds release $VERSION."
              exit 0
            fi
            node --input-type=module - <<'EOF'
          import { ReleaseClient } from 'nx/release';

          await new ReleaseClient({
            version: { preVersionCommand: '' },
          }).releaseVersion({
            specifier: process.env.VERSION,
            gitCommit: false,
            gitTag: false,
            gitPush: false,
            stageChanges: true,
          });
          EOF
            merge="$(git commit-tree "$(git write-tree)" -p HEAD -p "$RELEASE" -m "chore(release): merge $VERSION into main")"
            if git push origin "$merge:refs/heads/main"; then
              exit 0
            fi
          done
          exit 1
