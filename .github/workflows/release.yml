name: Release

# Releases each push to main and does not wait for CI (docs/adr/0007): the
# pre-push hook proved lint, typecheck and build of each pushed commit, and CI
# runs beside the release and only reports. nx release version writes the
# versions that the conventional commits since the last release tag ask into
# the runner's checkout only: it commits, tags and pushes nothing, and main
# keeps the versions of its files. The release tag is then made on the pushed
# commit through the GitHub API, and nx-release-publish publishes what was
# built from it. So nothing reaches npm without its tag. A version already on
# npm is skipped. A commit with nothing to release changes nothing.
on:
  push:
    branches: [main]

# A release is never cancelled: one stopped between the tag and the publish
# would leave a version unpublished. The pushes that arrive during a release
# wait as one pending run, and a newer push replaces it, so the newest push
# releases every commit since the last release. Each run finds the tag of the
# run before it.
concurrency:
  group: release
  cancel-in-progress: false

# nx.json runs 6 tasks at once for the 14-core Mac that the sessions push from;
# the runner keeps Nx's default of 3, as NX_PARALLEL wins over nx.json.
env:
  NX_PARALLEL: 3

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The tag step creates refs/tags/release/<version> through the API.
      contents: write
      id-token: write
    # The release restores the npm cache but never writes one.
    cache-mode: read
    steps:
      # The tags come with the history: Nx counts the commits since the newest
      # release tag that the pushed commit holds.
      - name: Checkout the pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org/

      # The preVersionCommand builds sqlite-open, whose native target builds
      # with Zig.
      - name: Set up Zig
        uses: $/.github/actions/setup-zig

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # The preVersionCommand builds the pushed commit, and the publish packs
      # that build. When a release tag already points at the pushed commit, a
      # run of this commit tagged it and stopped before the end (#4692): this
      # run writes that version again and publishes what npm does not have.
      # The lock file is not updated: nothing reads it after this step.
      - name: Version the pushed commit
        id: version
        run: |
          # nx release runs here through its Node API, not npx, so the shell
          # that runs the preVersionCommand needs node_modules/.bin on PATH
          # to find nx ("/bin/sh: nx: not found" in run 44767683501).
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          TAGGED="$(git for-each-ref --points-at HEAD --format='%(refname:strip=2)' 'refs/tags/release/*')" node --input-type=module - <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { releaseVersion } from 'nx/release';

          const tagged = process.env.TAGGED;
          const { workspaceVersion } = await releaseVersion({
            specifier: tagged === '' ? undefined : tagged.slice('release/'.length),
            gitCommit: false,
            gitTag: false,
            gitPush: false,
            stageChanges: false,
            versionActionsOptionsOverrides: { skipLockFileUpdate: true },
          });
          if (workspaceVersion) {
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `version=${workspaceVersion}\ntagged=${tagged !== ''}\n`,
            );
          } else {
            console.log(`${process.env.GITHUB_SHA} has nothing to release.`);
          }
          EOF

      # The tag goes first: the next release counts its commits from it, so a
      # version reaches npm only once its tag is there. The tag names the
      # pushed commit, which main already holds, so the API makes no new
      # object and starts no workflow run. When GitHub refuses the tag, the
      # step fails and nothing is published; the Release run of the next push
      # counts from the tag before and releases these commits too.
      - name: Tag the pushed commit
        if: steps.version.outputs.version != '' && steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/release/$VERSION" -f "sha=$GITHUB_SHA"

      - name: Publish
        if: steps.version.outputs.version != ''
        uses: $/.github/actions/nx-release-publish
        with:
          token: ${{ secrets.NPM_ACCESS_TOKEN }}
