name: Docker tests

# The Docker-backed tests pull several database images, so they run only when
# what they cover changes. ci.yml skips them on every operating system.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/testing/**'
      - 'packages/mutex/src/lock-stores/file-system/**'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'packages/testing/**'
      - 'packages/mutex/src/lock-stores/file-system/**'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping: this job exists to run them.
      ZUKHRUF_TESTING_DOCKER: required
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The mutex's container tests never pull their image themselves.
      - name: Pull the mutex's container image
        run: docker pull node:lts-alpine

      - name: Test the Docker-backed projects
        run: npx nx run-many -t test --projects=testing,mutex
