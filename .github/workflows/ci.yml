name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request replaces its run. On main every commit keeps its
# own run, even when it is run again: release.yml releases a commit only after
# CI passes for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # nx-set-shas reads this workflow's runs to find the last green commit.
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Find what changed since the last green commit
        uses: nrwl/nx-set-shas@v5

      - name: Check Nx workspace sync
        run: npx nx sync:check

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint, type check, test and build what changed
        run: npx nx affected -t lint typecheck test test-latest-release build
