name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request replaces its run. On main every commit keeps its
# own run, even when it is run again: release.yml releases a commit only after
# CI passes for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # nx-set-shas reads this workflow's runs to find the last green commit.
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace and find what changed
        uses: ./.github/actions/setup-affected

      - parallel:
          - name: Check Nx workspace sync
            run: npx nx sync:check

          - name: Check formatting
            run: npx prettier --check .

      - name: Lint, type check, test and build what changed, except the testing package
        run: npx nx affected -t lint typecheck test test-latest-release build --exclude=testing

  # The testing package starts five database servers. On the runner of the
  # other projects, their load made the timing tests of mutex fail, so the
  # package has a runner of its own.
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace and find what changed
        uses: ./.github/actions/setup-affected

      - name: Lint, type check, test and build the testing package if it changed
        run: npx nx affected -t lint typecheck test build --exclude='*,!testing'
