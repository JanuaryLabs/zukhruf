name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI reports on main and gates nothing: release.yml releases each push without
# waiting for it (docs/adr/0007). On main a push never cancels the run in
# progress, because pushes come faster than a run ends, and a run that is
# always cancelled never says whether main is green. The pushes that arrive
# meanwhile wait as one pending run: the default queue holds a single pending
# run, and a newer push replaces it. Each push holds the code of the pushes
# before it, and affected-range starts at the last green run, so the next run
# checks every commit it skipped. A release tag can be on a commit that CI has
# not checked yet, so no tag moves that base (tested-tags: ''). On a pull
# request a new push cancels the run in progress. A run again of an older
# commit of main replaces the pending run of the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # affected-range reads this workflow's runs to find the last green commit,
  # and the plan job the task profiles of the last green runs.
  actions: read
  contents: read

# nx.json runs 6 tasks at once for the 14-core Mac that the sessions push from.
# A runner has 4 CPUs (macOS 3), so every nx call here keeps Nx's default of 3:
# NX_PARALLEL wins over nx.json.
#
# Each saved Nx cache holds every task result that Nx keeps, and the repo has
# 10 GB of Actions cache. Nx drops a result unused for 7 days and, past this
# size, the least recently used ones; without it the limit is a tenth of the
# disk (nx/src/native/cache/cache.rs). On the Mac, 349 results take 39 MB.
env:
  NX_PARALLEL: 3
  NX_MAX_CACHE_SIZE: 500MB

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # sqlite-open's native target builds with zig cc (packages/sqlite/open/docs/adr/0006).
      - name: Set up Zig
        id: zig
        background: true
        uses: $/.github/actions/setup-zig

      - name: Restore the Nx cache
        id: nx-cache
        background: true
        uses: $/.github/actions/nx-cache/restore

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      - name: Find what changed
        uses: $/.github/actions/affected-range
        with:
          tested-tags: ''

      # Before the first nx command, which opens the database the restore writes.
      - name: Wait for the Nx cache
        wait: nx-cache

      # The checks of the whole tree run beside the affected targets.
      - name: Check Nx workspace sync
        background: true
        run: npx nx sync:check

      - name: Check formatting
        background: true
        run: npx prettier --check .

      # No Nx project holds these files, so nx affected never lints them.
      - name: Lint the root package.json, the lockfile and the workflows
        background: true
        run: npx eslint package.json package-lock.json .github

      - name: Check that the README's Packages table is the one the package.json descriptions give
        background: true
        run: npx nx run readme-table:check

      - name: Audit the workflows
        background: true
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true

      - name: Wait for Zig
        wait: zig

      # After Zig and not in the background: through @zukhruf/fs it builds
      # sqlite-open's native libraries, which nx affected builds too, and two
      # zig processes that write one library fail (run 44387506057).
      - name: Check that a copy ledger records each copy in the test files
        run: npx nx run copy-check:check

      # The test jobs run the test targets. test-network stays here: it is
      # short, and it reads the network instead of the cache.
      # The projects tagged platform:darwin run in the darwin job. The profile
      # goes to .nx, which git ignores, so the formatting check never reads it.
      - name: Lint, type check and build what changed, and run its network tests
        run: npx nx affected -t lint typecheck test-network build --exclude='tag:platform:darwin'
        env:
          NX_PROFILE: .nx/nx-profile.json

      - name: Wait for the checks of the whole tree
        wait-all:

      # CI hides the output of tasks that pass, so the Nx task profile and the
      # junit file of each project are kept to find the slow tasks and tests.
      - name: Keep the task profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The profile is under .nx, which the action skips unless told.
          include-hidden-files: true
          name: ci
          path: |
            .nx/nx-profile.json
            packages/**/test-results.xml
            apps/**/test-results.xml

      # After the wait for the checks, since readme-table:check is an nx task too.
      - name: Save the Nx cache
        if: always()
        uses: $/.github/actions/nx-cache/save
        with:
          save-key: ${{ steps.nx-cache.outputs.save-key }}

  # Deals the affected test tasks to the test machines by the time each took
  # in the last green runs on main (tools/test-split). The workflow names no
  # project: a project with no time yet counts as the average. It also tells
  # the darwin job whether a platform:darwin project changed.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      machines: ${{ steps.plan.outputs.machines }}
      darwin: ${{ steps.darwin.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The task profiles of the last five green runs, one folder per run: the
      # plan takes each task's time from the newest run that executed it
      # instead of reading it from the cache. The test machines upload theirs as
      # test-<machine>; a run from before the split ran the tests in the ci job,
      # which uploaded its profile under the action's default name, artifact.
      # Without them, every task counts as the target, and the plan still runs
      # every test.
      - name: Download the task profiles of the last green runs
        id: profiles
        background: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROFILES: ${{ runner.temp }}/profiles
        run: |
          runs="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 5 --json databaseId --jq '.[].databaseId')" || {
            echo "::warning::No list of the last green runs, so every test task counts as the target"
            exit 0
          }
          for run in $runs; do
            gh run download "$run" --pattern 'test-*' --pattern artifact --dir "$PROFILES/$run" || echo "Run $run has no task profile of its tests"
          done

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      - name: Find what changed
        uses: $/.github/actions/affected-range
        with:
          tested-tags: ''

      - name: Find whether a platform:darwin project changed
        id: darwin
        run: |
          # --json=false prints one name per line, and nothing when none is affected.
          projects="$(npx nx show projects --affected --projects='tag:platform:darwin' --json=false)"
          if [ -n "$projects" ]; then echo 'affected=true'; else echo 'affected=false'; fi >> "$GITHUB_OUTPUT"

      - name: Wait for the task profiles
        wait: profiles

      # The same selection as the test targets that ci ran before the split.
      - name: Plan the test machines
        id: plan
        env:
          PROFILES: ${{ runner.temp }}/profiles
        run: |
          npx nx affected -t test --exclude='tag:platform:darwin' --graph=stdout |
            node tools/test-split/src/main.ts --profiles "$PROFILES" --minutes 5 --machines 8 --parallel "$NX_PARALLEL" >> "$GITHUB_OUTPUT"

  # One machine for each entry of the plan. A failed machine leaves the others
  # running, so each reports its tests and saves its cache.
  test:
    name: test ${{ matrix.machine }}
    needs: plan
    if: needs.plan.outputs.machines != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # sqlite-open's native target builds with zig cc (packages/sqlite/open/docs/adr/0006).
      - name: Set up Zig
        background: true
        uses: $/.github/actions/setup-zig

      # nx:test runs the tofu tests of the dokploy-stack module and the tofu fmt
      # and validate tests of the dokploy generator, which skip without tofu.
      # 1.12.3 is the version that the hosts require (packages/nx/docs/adr/0015).
      - name: Set up OpenTofu
        background: true
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      # A machine number holds much the same tasks from run to run, so it
      # restores the cache that the same number saved last.
      - name: Restore the Nx cache
        id: nx-cache
        background: true
        uses: $/.github/actions/nx-cache/restore
        with:
          name: test-${{ matrix.machine }}

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      - name: Wait for Zig, OpenTofu and the Nx cache
        wait-all:

      # The plan job reads this profile in the next runs: keep the artifact
      # name test-<machine>.
      - name: Test this machine's projects
        run: npx nx run-many -t test --projects="$PROJECTS" ${SHARD:+"--test-shard=$SHARD"}
        env:
          PROJECTS: ${{ matrix.projects }}
          SHARD: ${{ matrix.shard }}
          NX_PROFILE: .nx/nx-profile.json

      - name: Keep the task profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The profile is under .nx, which the action skips unless told.
          include-hidden-files: true
          name: test-${{ matrix.machine }}
          path: |
            .nx/nx-profile.json
            packages/**/test-results.xml
            apps/**/test-results.xml

      - name: Save the Nx cache
        if: always()
        uses: $/.github/actions/nx-cache/save
        with:
          save-key: ${{ steps.nx-cache.outputs.save-key }}

  # A project that drives a facility of macOS, such as launchd, runs all its
  # targets on a macOS runner (docs/adr/0005). The pattern selects every project
  # and then takes the platform:darwin ones back out of the exclusion.
  #
  # GitHub has few hosted Macs: darwin starts only when a project tagged
  # platform:darwin is affected, which the plan job asks Nx, so a push that
  # changes none of them never waits for one (#5009; run 44769332904 failed
  # when no Mac came in 15 min). When one is affected, darwin runs, and a Mac
  # it cannot get still fails the run, as ADR 0005 asks of a test that needs a
  # capability.
  darwin:
    needs: plan
    if: needs.plan.outputs.darwin == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Zig
        id: zig
        background: true
        uses: $/.github/actions/setup-zig

      - name: Restore the Nx cache
        id: nx-cache
        background: true
        uses: $/.github/actions/nx-cache/restore

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      - name: Find what changed
        uses: $/.github/actions/affected-range
        with:
          tested-tags: ''

      - name: Wait for Zig
        wait: zig

      - name: Wait for the Nx cache
        wait: nx-cache

      - name: Lint, type check, test and build what changed
        run: npx nx affected -t lint typecheck test test-network build --exclude='*,!tag:platform:darwin'
        env:
          NX_PROFILE: .nx/nx-profile.json

      - name: Keep the task profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The profile is under .nx, which the action skips unless told.
          include-hidden-files: true
          name: darwin
          path: |
            .nx/nx-profile.json
            packages/**/test-results.xml

      - name: Save the Nx cache
        if: always()
        uses: $/.github/actions/nx-cache/save
        with:
          save-key: ${{ steps.nx-cache.outputs.save-key }}
