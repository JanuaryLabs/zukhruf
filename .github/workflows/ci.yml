name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request replaces its run. On main every commit keeps its
# own run, even when it is run again: release.yml releases a commit only after
# CI passes for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # The release commit changes every package.json and gets no CI run, so a
      # compare with the last green commit always sees every project changed.
      - name: Find what changed since the last release
        run: |
          base=$(git describe --tags --abbrev=0 --match 'release/*')
          head=$(git rev-parse HEAD)
          echo "NX_BASE=$base" >> "$GITHUB_ENV"
          echo "NX_HEAD=$head" >> "$GITHUB_ENV"

      - parallel:
          - name: Check Nx workspace sync
            run: npx nx sync:check

          - name: Check formatting
            run: npx prettier --check .

      - name: Lint, type check, test and build what changed
        run: npx nx affected -t lint typecheck test build
