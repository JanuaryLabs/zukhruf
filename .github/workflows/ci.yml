name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # docker.yml runs the Docker-backed tests when their paths change.
      ZUKHRUF_TESTING_DOCKER: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Nx workspace sync
        run: npx nx sync:check

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint, type check, test and build
        run: npx nx run-many -t lint typecheck test build

      - name: Verify published package contracts
        run: npm run verify:packages

  eslint-floor:
    # @zukhruf/eslint supports ESLint ^9.30 on Node 24; the workspace itself
    # runs ESLint 10 on Node 26, so the bottom of the range runs here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the oldest supported ESLint
        run: npm install --no-save eslint@9.30.0 @eslint/js@9.30.0

      - name: Test @zukhruf/eslint
        run: npx nx run eslint:test --skip-nx-cache

  testing-floor:
    # @zukhruf/testing supports Node 24.4; the workspace itself runs Node 26,
    # so the bottom of the range runs here. Docker-backed tests run in docker.yml.
    runs-on: ubuntu-latest
    env:
      ZUKHRUF_TESTING_DOCKER: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test @zukhruf/testing
        run: npx nx run testing:test --skip-nx-cache
