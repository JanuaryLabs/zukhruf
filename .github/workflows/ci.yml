name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request replaces its run. On main every commit keeps its
# own run, even when it is run again: release.yml releases a commit only after
# CI passes for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Find what changed since the last release
        uses: ./.github/actions/affected-range

      - parallel:
          - name: Check Nx workspace sync
            run: npx nx sync:check

          - name: Check formatting
            run: npx prettier --check .

          # No Nx project holds these two files, so nx affected never lints them.
          - name: Lint the root package.json and the lockfile
            run: npx eslint package.json package-lock.json

          - name: Check that a copy ledger records each copy in the test files
            run: npx nx run copy-check:check

          - name: Check that the README's Packages table is the one the package.json descriptions give
            run: npx nx run readme-table:check

      # The projects tagged platform:darwin run in the darwin job.
      - name: Lint, type check, test and build what changed
        run: npx nx affected -t lint typecheck test test-network build --exclude='tag:platform:darwin'
        env:
          NX_PROFILE: nx-profile.json

      # CI hides the output of tasks that pass, so the Nx task profile and the
      # junit file of each project are kept to find the slow tasks and tests.
      - name: Keep the task profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: |
            nx-profile.json
            packages/**/test-results.xml
            apps/**/test-results.xml

  # A project that drives a facility of macOS, such as launchd, runs all its
  # targets on a macOS runner (docs/adr/0005). The pattern selects every project
  # and then takes the platform:darwin ones back out of the exclusion.
  darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Find what changed since the last release
        uses: ./.github/actions/affected-range

      - name: Lint, type check, test and build what changed
        run: npx nx affected -t lint typecheck test test-network build --exclude='*,!tag:platform:darwin'
        env:
          NX_PROFILE: nx-profile.json

      - name: Keep the task profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: darwin
          path: |
            nx-profile.json
            packages/**/test-results.xml
