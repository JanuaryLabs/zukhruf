name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI reports on main and gates nothing: release.yml releases each push without
# waiting for it (docs/adr/0007). On main a push never cancels the run in
# progress, because pushes come faster than a run ends, and a run that is
# always cancelled never says whether main is green. The pushes that arrive
# meanwhile wait as one pending run: the default queue holds a single pending
# run, and a newer push replaces it. Each push holds the code of the pushes
# before it, and affected-range starts at the last green run, so the next run
# checks every commit it skipped. A release tag can be on a commit that CI has
# not checked yet, so no tag moves that base (tested-tags: ''). On a pull
# request a new push cancels the run in progress. A run again of an older
# commit of main replaces the pending run of the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # affected-range reads this workflow's runs to find the last green commit.
  actions: read
  contents: read

# nx.json runs 6 tasks at once for the 14-core Mac that the sessions push from.
# A runner has 4 CPUs (macOS 3), so every nx call here keeps Nx's default of 3:
# NX_PARALLEL wins over nx.json.
#
# Each saved Nx cache holds every task result that Nx keeps, and the repo has
# 10 GB of Actions cache. Nx drops a result unused for 7 days and, past this
# size, the least recently used ones; without it the limit is a tenth of the
# disk (nx/src/native/cache/cache.rs). On the Mac, 349 results take 39 MB.
env:
  NX_PARALLEL: 3
  NX_MAX_CACHE_SIZE: 500MB

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # sqlite-open's native target builds with zig cc (packages/sqlite/open/docs/adr/0006).
      - name: Set up Zig
        id: zig
        background: true
        uses: $/.github/actions/setup-zig

      # nx:test runs the tofu tests of the dokploy-stack module and the tofu fmt
      # and validate tests of the dokploy generator, which skip without tofu.
      # 1.12.3 is the version that the hosts require (packages/nx/docs/adr/0015).
      - name: Set up OpenTofu
        id: tofu
        background: true
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      # Nx keeps its cache and the database that indexes it in ~/.nx/<workspace>/,
      # and it reads only the database named after the machine ID
      # (nx/src/native/db/mod.rs), which a runner image bakes in. The key holds
      # the ID, so a new image starts a new cache instead of carrying results
      # that no database indexes.
      - name: Find the machine ID that names the Nx database
        id: nx-machine
        run: echo "id=$(cat /var/lib/dbus/machine-id /etc/machine-id 2> /dev/null | head -n 1 | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the Nx cache
        id: nx-cache
        background: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ steps.nx-machine.outputs.id }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ steps.nx-machine.outputs.id }}-

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      - name: Find what changed
        uses: $/.github/actions/affected-range
        with:
          tested-tags: ''

      # Before the first nx command, which opens the database the restore writes.
      - name: Wait for the Nx cache
        wait: nx-cache

      # The checks of the whole tree run beside the affected targets.
      - name: Check Nx workspace sync
        background: true
        run: npx nx sync:check

      - name: Check formatting
        background: true
        run: npx prettier --check .

      # No Nx project holds these files, so nx affected never lints them.
      - name: Lint the root package.json, the lockfile and the workflows
        background: true
        run: npx eslint package.json package-lock.json .github

      - name: Check that the README's Packages table is the one the package.json descriptions give
        background: true
        run: npx nx run readme-table:check

      - name: Audit the workflows
        background: true
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true

      - name: Wait for Zig
        wait: zig

      # After Zig and not in the background: through @zukhruf/fs it builds
      # sqlite-open's native libraries, which nx affected builds too, and two
      # zig processes that write one library fail (run 44387506057).
      - name: Check that a copy ledger records each copy in the test files
        run: npx nx run copy-check:check

      - name: Wait for OpenTofu
        wait: tofu

      # The projects tagged platform:darwin run in the darwin job. The profile
      # goes to .nx, which git ignores, so the formatting check never reads it.
      - name: Lint, type check, test and build what changed
        run: npx nx affected -t lint typecheck test test-network build --exclude='tag:platform:darwin'
        env:
          NX_PROFILE: .nx/nx-profile.json

      - name: Wait for the checks of the whole tree
        wait-all:

      # CI hides the output of tasks that pass, so the Nx task profile and the
      # junit file of each project are kept to find the slow tasks and tests.
      - name: Keep the task profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The profile is under .nx, which the action skips unless told.
          include-hidden-files: true
          path: |
            .nx/nx-profile.json
            packages/**/test-results.xml
            apps/**/test-results.xml

      # After the wait for the checks, since readme-table:check is an nx task too.
      # Only main saves, and a failed or cancelled run saves the results it has:
      # Nx caches only the tasks that passed (task-orchestrator.js shouldCacheTaskResult).
      # A run again of the same commit finds its key taken: a cache key is immutable.
      - name: Save the Nx cache
        if: always() && github.event_name == 'push' && steps.nx-cache.outputs.cache-primary-key != '' && steps.nx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nx
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

  # GitHub has few hosted Macs: darwin starts only when a project tagged
  # platform:darwin is affected, so a push that changes none of them never
  # waits for one (#5009; run 44769332904 failed when no Mac came in 15 min).
  # When one is affected, darwin runs, and a Mac it cannot get still fails the
  # run, as ADR 0005 asks of a test that needs a capability.
  changes:
    runs-on: ubuntu-latest
    outputs:
      darwin: ${{ steps.darwin.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      - name: Find what changed
        uses: $/.github/actions/affected-range
        with:
          tested-tags: ''

      - name: Find whether a platform:darwin project changed
        id: darwin
        run: |
          # --json=false prints one name per line, and nothing when none is affected.
          projects="$(npx nx show projects --affected --projects='tag:platform:darwin' --json=false)"
          if [ -n "$projects" ]; then echo 'affected=true'; else echo 'affected=false'; fi >> "$GITHUB_OUTPUT"

  # A project that drives a facility of macOS, such as launchd, runs all its
  # targets on a macOS runner (docs/adr/0005). The pattern selects every project
  # and then takes the platform:darwin ones back out of the exclusion.
  darwin:
    needs: changes
    if: needs.changes.outputs.darwin == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Zig
        id: zig
        background: true
        uses: $/.github/actions/setup-zig

      # The same Nx cache restore and save as the ci job, with the Mac's machine
      # ID: a fix to these steps goes into both jobs (strike 2, #4975).
      # The database of a Mac is named after its hardware UUID, as ioreg prints it.
      - name: Find the machine ID that names the Nx database
        id: nx-machine
        run: echo "id=$(ioreg -rd1 -c IOPlatformExpertDevice | awk -F '"' '/IOPlatformUUID/ { print $4 }' | shasum -a 256 | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the Nx cache
        id: nx-cache
        background: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ steps.nx-machine.outputs.id }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ steps.nx-machine.outputs.id }}-

      - name: Set up the workspace
        uses: $/.github/actions/setup-workspace

      - name: Find what changed
        uses: $/.github/actions/affected-range
        with:
          tested-tags: ''

      - name: Wait for Zig
        wait: zig

      - name: Wait for the Nx cache
        wait: nx-cache

      - name: Lint, type check, test and build what changed
        run: npx nx affected -t lint typecheck test test-network build --exclude='*,!tag:platform:darwin'
        env:
          NX_PROFILE: .nx/nx-profile.json

      - name: Keep the task profile and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The profile is under .nx, which the action skips unless told.
          include-hidden-files: true
          name: darwin
          path: |
            .nx/nx-profile.json
            packages/**/test-results.xml

      - name: Save the Nx cache
        if: always() && github.event_name == 'push' && steps.nx-cache.outputs.cache-primary-key != '' && steps.nx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nx
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}
