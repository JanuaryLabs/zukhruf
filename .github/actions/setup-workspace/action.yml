name: Set up the workspace
description: Installs the newest Node.js LTS, the latest npm, and the workspace's npm dependencies. Other repositories use it as JanuaryLabs/zukhruf/.github/actions/setup-workspace@main.

inputs:
  registry-url:
    description: The npm registry to authenticate against. Only a job that publishes sets it.
    required: false

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        registry-url: ${{ inputs.registry-url }}

    # The lockfile and allowScripts are npm 12's; the npm that Node bundles is
    # older, runs every install script and resolves peer ranges differently.
    - name: Install the latest npm
      shell: bash
      run: npm install -g npm@latest

    - name: Install dependencies
      shell: bash
      run: npm ci
