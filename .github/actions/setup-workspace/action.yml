name: Set up the workspace
description: Installs the newest Node.js LTS, zig for the native libraries of @zukhruf/sqlite-open, and the workspace's npm dependencies.

inputs:
  registry-url:
    description: The npm registry to authenticate against. Only a job that publishes sets it.
    required: false

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        registry-url: ${{ inputs.registry-url }}

    # sqlite-open's native target builds the library of each platform with
    # zig cc, here and in the release (packages/sqlite/open/docs/adr/0006).
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Install dependencies
      shell: bash
      run: npm ci
