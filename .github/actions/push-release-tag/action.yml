name: Push the release tag
description: Pushes refs/tags/release/<version> and sets pushed to 'true', or to 'false' when GitHub refuses the tag because a newer push changed a workflow while the release ran; that push's own Release run releases the commits. Any other refusal fails the step. The job needs contents write permission and a checkout that keeps its credentials.

inputs:
  version:
    description: The version that nx release version tagged, such as 0.8.46.
    required: true

outputs:
  pushed:
    description: "'true' when origin has the tag, 'false' when GitHub refused it for a workflow."
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Push the tag
      id: push
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: sh "$GITHUB_ACTION_PATH/push-tag.sh" "$VERSION" >> "$GITHUB_OUTPUT"
