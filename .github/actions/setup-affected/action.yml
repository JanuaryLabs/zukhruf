name: Set up the workspace and find what changed
description: Installs the workspace, then sets NX_BASE and NX_HEAD to the last commit whose CI passed and this commit, for nx affected.

runs:
  using: composite
  steps:
    - name: Set up the workspace
      uses: ./.github/actions/setup-workspace

    - name: Find what changed since the last green commit
      uses: nrwl/nx-set-shas@v5
