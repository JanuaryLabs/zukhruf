name: Build an image to GHCR
description: Builds a Dockerfile with Buildx and pushes it to ghcr.io/<owner>/<image>:<sha>, reading and writing a registry build cache at :buildcache. The owner is the repository owner in lowercase, as GHCR requires. ghcr-promote moves a tag to the image afterwards. The job needs packages write permission. Other repositories use it as JanuaryLabs/zukhruf/.github/actions/ghcr-image@main.

inputs:
  image:
    description: The image name under ghcr.io/<owner>/, such as whatisgoingon-backend.
    required: true
  dockerfile:
    description: The Dockerfile, relative to the workspace.
    required: true
  context:
    description: The build context.
    required: false
    default: .
  target:
    description: The stage to build. Empty builds the last stage.
    required: false
    default: ''
  platforms:
    description: The platforms to build, separated by commas.
    required: false
    default: linux/amd64
  build-args:
    description: Build arguments, one NAME=value per line.
    required: false
    default: ''
  sha:
    description: The tag the image is pushed under.
    required: false
    default: ${{ github.sha }}
  token:
    description: The token that logs in to ghcr.io.
    required: false
    default: ${{ github.token }}

outputs:
  ref:
    description: The pushed image, ghcr.io/<owner>/<image>:<sha>.
    value: ${{ steps.name.outputs.repository }}:${{ inputs.sha }}
  digest:
    description: The digest of the pushed image.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Name the image
      id: name
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push ${{ inputs.image }}
      id: build
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.build-args }}
        push: true
        tags: ${{ steps.name.outputs.repository }}:${{ inputs.sha }}
        cache-from: type=registry,ref=${{ steps.name.outputs.repository }}:buildcache
        cache-to: type=registry,ref=${{ steps.name.outputs.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
