- id: connection-burst
  name: more than 1000 concurrent connections to a published port
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: a host load generator against 127.0.0.1:<published port>
    workload: more than 1000 concurrent TCP connections to a published 127.0.0.1 port, per engine
  hypothesis: Colima's Lima ssh port forwarder has a known cap of about 1000 concurrent connections on published ports.
  measure: open more than 1000 concurrent connections to a container's published 127.0.0.1 port and count those that connect and stay up, per engine.
  expected: Colima caps near 1000; Docker Desktop does not.
  risks: The host's own file-descriptor limit must be raised above the burst so it does not cap first.
  source: Lima's ssh port forwarder; Colima's default
  status: proposed
  attempts: []
