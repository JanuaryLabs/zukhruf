- id: iperf3-network
  name: throughput on iperf3
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: docker CLI against each engine socket
    workload: container to container, and host to container
  hypothesis: Traffic between Apple's VMs crosses the host's virtual network.
  measure: >-
    iperf3 -c <ip> -t 10 -J
  expected: Apple 5-10x lower.
  risks: network connect is a no-op on socktainer; containers must share the default network.
  source: zot24/macos-container-benchmarks
  status: proposed
  attempts:
    - date: 2026-11-15
      status: invalid
      reasons:
        - "socktainer 1.6.1 (Homebrew bottle) is built for apple/container 1.6.1 (Package.swift at tag v1.6.1 pins exactly 1.6.1) but container 1.7.1 ran; socktainer's startup log warns 'Apple Container version mismatch: detected 1.7.1 but this socktainer binary requires 1.6.1'"
        - 'the Mac was busy: load average 3.0 at the start, and 4 shared zukhruf-testing database servers of another session ran on Docker Desktop'
        - 'script bug: every captured JSON file is 0 bytes and the experiment exited 0; measure_path declared `local path`, which in zsh is the array tied to PATH, so every client call failed with exit 127 (command not found); fixed: the local is `route`, and every result file must be non-empty JSON'
      raw: ~/.claude/scratch/container-engines/runs-attempt-1-invalid/iperf3-network/20261115T200505Z
  verdict: null

- id: sysbench-cpu
  name: events per second on sysbench cpu
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: docker CLI against each engine socket
    workload: sysbench cpu with 4 threads and 4 CPUs on both engines
  hypothesis: Both engines run on Apple's Virtualization framework, so CPU work costs the same.
  measure: >-
    sysbench cpu --threads=4 --time=30 run
  expected: A tie.
  risks: Apple takes whole vCPUs only; limits must match.
  source: RepoFlow blog; Jmeg8r/apple-container-vs-docker
  status: proposed
  attempts:
