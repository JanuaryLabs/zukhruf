# Experiments for docs/research/container-engines/README.md.
# Order: test-relevant first. Runs append to `attempts` and set `status`, `verdict` and `verdict_reason`.
# combination.engine names the engines of scripts/README.md's engine table (Ezz, 2026-11-16):
# docker = Docker Desktop on VZ, docker-vmm = Docker Desktop on Docker VMM, colima, orbstack, and
# apple = Apple container 1.7.1 through socktainer.

- id: startup-alpine-true
  name: start-to-exit on run --rm alpine true
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: docker CLI against each engine socket; Apple's own `container` CLI as a third arm
    workload: run --rm <alpine digest> true, warm
  hypothesis: Apple boots one VM per container, so each start costs more than a process start in Docker's shared VM.
  measure: >-
    hyperfine 2.0.0 --warmup 3 --runs 30 --export-json
    'docker -H unix://<socket> run --rm <alpine digest> true'
    'container run --rm <alpine digest> true'
  expected: Apple about 3x slower.
  risks: Cold runs (init image download, socktainer's first create) must stay out of the warm runs.
  source: zot24/macos-container-benchmarks; Jmeg8r/apple-container-vs-docker
  status: done
  attempts:
    - date: 2026-11-15
      status: invalid
      reasons:
        - "socktainer 1.6.1 (Homebrew bottle) is built for apple/container 1.6.1 (Package.swift at tag v1.6.1 pins exactly 1.6.1) but container 1.7.1 ran; socktainer's startup log warns 'Apple Container version mismatch: detected 1.7.1 but this socktainer binary requires 1.6.1'"
        - 'the Mac was busy: load average 31.1 (1 min) at the start, and 6 other containers ran on Docker Desktop, among them the 4 shared zukhruf-testing database servers of another session'
      raw: ~/.claude/scratch/container-engines/runs-attempt-1-invalid/startup-alpine-true/20261115T194549Z
      contaminated_orientation_only:
        note: contaminated, orientation only; medians of 30 runs each, interleaved slots 01-docker, 02-apple, 03-docker, 04-apple
        docker_docker_cli_ms: [241.3, 195.4]
        apple_container_cli_ms: [918.8, 886.4]
        apple_via_socktainer_ms: [1215.1, 1187.2]
    - date: 2026-11-16
      status: done
      engines: [docker, colima]
      engine_setup:
        docker: Docker Desktop on VZ, 8 CPUs, 8 GiB, Docker 29.8.0
        colima: Colima 0.10.3, VZ + virtiofs + Rosetta, 8 CPUs, 8 GiB, Docker 29.5.2, Lima ssh port forwarder (the grpc forwarder loses backpressure)
      head: 961a7733
      order: docker, colima interleaved
      results: docs/research/container-engines/results/2026-11-16-docker-vs-colima.md
      raw: docs/research/container-engines/runs/startup-alpine-true/20261116T075712Z
      key_numbers:
        warm_median_ms: { docker: 153.1, colima: 158.2 }
        round_medians_ms: { docker: [160.8, 145.3], colima: [158.2, 158.2] }
        min_max_ms: { docker: [121.2, 233.7], colima: [132.7, 244.6] }
        first_run_ms: { docker: 1387.4, colima: 191.8 }
      caveats:
        - 'no quiet gate (Ezz: "no gate needed"); other sessions used Docker Desktop during the pass and only this pass used Colima, a bias against Docker Desktop'
        - 'load average 18.7 at the start'
        - '5 containers left on Colima by the suites ran at the start (meta.json)'
        - 'first runs are one sample each and not counted'
  verdict: no-difference
  verdict_reason: "153.1 against 158.2 ms warm (+5.1 ms on Colima), inside Docker's A-to-A spread of 15.5 ms"

- id: postgres-time-to-ready
  name: time to ready on postgres:18-alpine
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: '@zukhruf/docker (a script under docs/research/container-engines/scripts/, written in a later step)'
    workload: postgres:18-alpine with the Env and limits of packages/testing/src/databases/postgres.ts (tmpfs data dir, 1 GiB memory, 1 CPU)
  hypothesis: Time to ready is the container start plus Postgres's own start; Apple adds the VM boot.
  measure: >-
    From create until pg_isready answers. On Apple, measured twice: on the published 127.0.0.1 port and on the container IP.
  expected: Apple slower by the VM boot.
  risks: Apple's published-port forwarder drops a connection on a client half-close; pg clients do not half-close, so expect it to work.
  source: packages/testing/src/databases/postgres.ts
  status: done
  attempts:
    - date: 2026-11-16
      status: done
      engines: [docker, colima]
      engine_setup:
        docker: Docker Desktop on VZ, 8 CPUs, 8 GiB, Docker 29.8.0
        colima: Colima 0.10.3, VZ + virtiofs + Rosetta, 8 CPUs, 8 GiB, Docker 29.5.2, Lima ssh port forwarder (the grpc forwarder loses backpressure)
      head: 961a7733
      order: docker, colima interleaved
      results: docs/research/container-engines/results/2026-11-16-docker-vs-colima.md
      raw: docs/research/container-engines/runs/postgres-time-to-ready/20261116T084831Z
      key_numbers:
        ready_published_median_ms: { docker: 722.4, colima: 701.4 }
        ready_round_medians_ms:
          { docker: [752.3, 692.4], colima: [705.0, 697.8] }
        ready_min_max_ms: { docker: [683.6, 765.7], colima: [682.7, 813.2] }
        total_median_ms: { docker: 824.6, colima: 826.2 }
        start_call_median_ms: { docker: 46.6, colima: 58.6 }
        remove_call_median_ms: { docker: 103.8, colima: 124.5 }
        published_tcp_median_ms: { docker: 64.3, colima: 77.5 }
      caveats:
        - 'no quiet gate (Ezz: "no gate needed"); other sessions used Docker Desktop during the pass and only this pass used Colima, a bias against Docker Desktop'
        - 'load average 3.8 at the start'
        - '10 warm runs per round, 2 rounds per engine; limits --cpus 2 --memory 1g, tmpfs data folder'
  verdict: no-difference
  verdict_reason: "ready on the published port 722.4 against 701.4 ms, inside Docker's 59.8 ms spread; Colima's start (+12 ms) and remove (+21 ms) calls are slower beyond the spread but Postgres's own start hides them"

- id: socktainer-overhead
  name: latency on create/start/inspect/remove through socktainer and the raw CLI
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: docker CLI against socktainer; Apple's raw `container` CLI
    workload: create, start, inspect, remove of one alpine container
  hypothesis: socktainer adds latency to each call. This separates the engine's cost from the shim's.
  measure: >-
    hyperfine 2.0.0 --warmup 3 --runs 30 --export-json
    on the same sequence through `docker -H unix://<socktainer socket>` and through `container`.
  expected: A small, constant cost per call from socktainer.
  risks: The two CLIs may not do the same work per step (for example, inspect detail).
  source: none; our question
  status: done
  attempts:
    - date: 2026-11-15
      status: invalid
      reasons:
        - "socktainer 1.6.1 (Homebrew bottle) is built for apple/container 1.6.1 (Package.swift at tag v1.6.1 pins exactly 1.6.1) but container 1.7.1 ran; socktainer's startup log warns 'Apple Container version mismatch: detected 1.7.1 but this socktainer binary requires 1.6.1'"
        - 'the Mac was busy: load average 11.4 at the start, and 4 shared zukhruf-testing database servers of another session ran on Docker Desktop'
        - "script bug: hyperfine 2.0 refused the whole-sequence arm, whose command contains &&, with 'Explicitly choose how to execute it: -S / --shell=default ... -N / --shell=none' (exit 1 after 19 s); fixed: that arm runs with --shell=default"
      raw: ~/.claude/scratch/container-engines/runs-attempt-1-invalid/socktainer-overhead/20261115T194828Z
    - date: 2026-11-16
      status: done
      engines: [docker, colima]
      engine_setup:
        docker: Docker Desktop on VZ, 8 CPUs, 8 GiB, Docker 29.8.0
        colima: Colima 0.10.3, VZ + virtiofs + Rosetta, 8 CPUs, 8 GiB, Docker 29.5.2, Lima ssh port forwarder (the grpc forwarder loses backpressure)
      head: 961a7733
      order: docker, colima interleaved
      results: docs/research/container-engines/results/2026-11-16-docker-vs-colima.md
      raw: docs/research/container-engines/runs/socktainer-overhead/20261116T075738Z
      key_numbers:
        arm: docker-cli only (the engines' API baseline)
        median_ms:
          create: { docker: 63.7, colima: 81.8, spread: [0.6, 67.7] }
          start: { docker: 103.8, colima: 116.0, spread: [45.9, 52.4] }
          inspect: { docker: 30.2, colima: 35.8, spread: [0.6, 0.3] }
          rm: { docker: 123.4, colima: 120.3, spread: [16.5, 15.8] }
          sequence: { docker: 287.6, colima: 435.8, spread: [82.3, 150.0] }
      caveats:
        - 'no quiet gate (Ezz: "no gate needed"); other sessions used Docker Desktop during the pass and only this pass used Colima, a bias against Docker Desktop'
        - 'load average 17 at the start and 62 at the end'
        - 'the max of the sequence reached 1.9 s on Docker and 2.0 s on Colima'
  verdict: docker-faster
  verdict_reason: "only inspect differs beyond the spread (+5.6 ms, +18% on Colima); create, start, rm and the whole sequence are within it. No Apple arm, so socktainer's own cost is still unmeasured"

- id: suites-wall-time
  name: wall time on the Docker-backed test suites
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: '@zukhruf/docker through nx'
    workload: nx run docker:test, nx run mutex:test, and testing's database suites after #4205
  hypothesis: The main criterion. Per-container VM boots may slow suites that start many containers.
  measure: >-
    scripts/suites-wall-time.zsh: after one build and one warm-up run per engine and project,
    the wall time ($EPOCHREALTIME) of
    'DOCKER_CONTEXT=<engine context> nx run <project>:test --skip-sync --skip-nx-cache --excludeTaskDependencies'
    for docker, mutex and testing, A,B,A,B, 3 runs per engine (--interleave 3), each behind a quiet gate
    (1-minute load below 8, no other node --test), under caffeinate -dimsu; per run the nx exit code
    and the junit testcases, failures and skipped of test-results.xml.
  expected: Unknown; this row decides the verdict.
  risks: Depends on backlog #4430's client fixes, and on #4205 for testing. A red suite counts against criterion 2.
  source: none; our suites
  status: done
  attempts:
    - date: 2026-11-16
      status: done
      engines: [docker, colima]
      engine_setup:
        docker: Docker Desktop on VZ, 8 CPUs, 8 GiB, Docker 29.8.0
        colima: Colima 0.10.3, VZ + virtiofs + Rosetta, 8 CPUs, 8 GiB, Docker 29.5.2, Lima ssh port forwarder (the grpc forwarder loses backpressure)
      head: 961a7733
      order: docker, colima interleaved
      results: docs/research/container-engines/results/2026-11-16-docker-vs-colima.md
      raw: docs/research/container-engines/runs/suites-wall-time/20261116T071419Z
      key_numbers:
        runs_per_engine: 3
        median_s:
          docker:
            {
              docker: 19.8,
              colima: 25.6,
              min_max: { docker: [19.3, 20.1], colima: [19.3, 28.6] },
            }
          mutex:
            {
              docker: 98.2,
              colima: 148.5,
              min_max: { docker: [95.1, 126.6], colima: [148.0, 148.6] },
            }
          testing:
            {
              docker: 295.9,
              colima: 265.5,
              min_max: { docker: [282.0, 303.9], colima: [253.3, 265.8] },
            }
        failures:
          02-colima-mutex: "1: docker-engine-store.test.ts 'a rung left by a killed test process is removed by the run's reaper after the run ends', TimeoutError after 120.6 s"
          04-colima-mutex: '1: the same test, after 120.8 s'
          06-colima-mutex: '1: the same test, after 120.7 s'
          03-docker-mutex: "1: socket/handshake.test.ts 'a store hung up on during a failover follows the leader that took over' (assertion leader vs follower; no engine involved)"
          01-docker-testing: "5: reaper.integration.test.ts, each 'No such image: alpine:latest'"
          05-docker-testing: "1: reaper.integration.test.ts 'a test process whose reaper was removed holds a new reaper at once, and that reaper removes what it creates after that, once it exits', waitFor() timed out after 33.7 s"
      caveats:
        - 'no quiet gate (Ezz: "no gate needed"); other sessions used Docker Desktop during the pass and only this pass used Colima, a bias against Docker Desktop'
        - 'run with --no-gate and --no-warmup; the warm-ups of pass 1 (runs/suites-wall-time/20261116T063919Z, not measurements) had pulled the images and created the shared servers'
        - 'load average 5 to 59 at run starts; up to 3 other node --test processes'
        - "the Colima mutex failure (also in pass 1's warm-up) is a test-fixture defect, not an engine one: packages/mutex/src/testing/subjects/docker-engine.ts:107-109 builds DockerTestbed({ environment: run }) with no DOCKER_HOST or DOCKER_CONTEXT, so the run's reaper is held on Docker Desktop while the store uses Colima and the test waits its full 120 s (REAPED_WITHIN); docker events proved it; came with 06d22ed3 (#4205)"
        - 'the whole mutex gap is that wait: docker-engine-store.test.ts junit per-file sums Docker 30.5/35.1/32.4 s, Colima 145.5/145.3/145.6 s; without the wait about 24.8 s on Colima against 27.8 s on Docker'
        - "03-docker-mutex's failure is a socket-store flake unrelated to any engine"
  verdict: mixed
  verdict_reason: "Colima is 30 s (10%) faster on testing in every run and ties on docker (within its 9.3 s spread); mutex's +50 s (51%) is a test-fixture defect's 120 s wait, not the engine (without it the store file is 24.8 s on Colima against 27.8 s on Docker), so mutex is re-measured after the fixture fix"

- id: fio-storage
  name: throughput on fio 4k and 1m random reads and writes
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: docker CLI against each engine socket
    workload: a bind mount, a named volume and the root filesystem
  hypothesis: Apple's bind mounts are slow at small blocks.
  measure: >-
    fio --rw=randwrite|randread --bs=4k|1m --size=256M --direct=1 --output-format=json
  expected: Apple loses at 4k on bind mounts.
  risks: The host page cache.
  source: apple/container #882; Jmeg8r/apple-container-vs-docker
  status: done
  attempts:
    - date: 2026-11-15
      status: invalid
      reasons:
        - "socktainer 1.6.1 (Homebrew bottle) is built for apple/container 1.6.1 (Package.swift at tag v1.6.1 pins exactly 1.6.1) but container 1.7.1 ran; socktainer's startup log warns 'Apple Container version mismatch: detected 1.7.1 but this socktainer binary requires 1.6.1'"
        - 'the Mac was busy: load average 15.6 at the start, and 4 shared zukhruf-testing database servers of another session ran on Docker Desktop'
        - "script bug: the Apple slot's docker run -d with a bind mount from under ~/Desktop hung until gtimeout killed it (exit 137); sandboxd logged tcc_server_message_request_authorization(kTCCServiceSystemPolicyDesktopFolder) failed: Apple's helper has no Files & Folders grant for ~/Desktop; fixed: the bind source is under the user's temporary folder"
      raw: ~/.claude/scratch/container-engines/runs-attempt-1-invalid/fio-storage/20261115T194847Z
    - date: 2026-11-16
      status: done
      engines: [docker, colima]
      engine_setup:
        docker: Docker Desktop on VZ, 8 CPUs, 8 GiB, Docker 29.8.0
        colima: Colima 0.10.3, VZ + virtiofs + Rosetta, 8 CPUs, 8 GiB, Docker 29.5.2, Lima ssh port forwarder (the grpc forwarder loses backpressure)
      head: 961a7733
      order: docker, colima interleaved
      results: docs/research/container-engines/results/2026-11-16-docker-vs-colima.md
      raw: docs/research/container-engines/runs/fio-storage/20261116T080108Z
      key_numbers:
        unit: 4k in IOPS, 1m in MiB/s; median of the two rounds
        bind:
          {
            randread_4k: [40328, 35010],
            randread_1m: [3402, 1640],
            randwrite_4k: [40158, 12677],
            randwrite_1m: [2917, 1462],
          }
        volume:
          {
            randread_4k: [133247, 154494],
            randread_1m: [37196, 19999],
            randwrite_4k: [143054, 97910],
            randwrite_1m: [9183, 6594],
          }
        rootfs:
          {
            randread_4k: [172831, 170115],
            randread_1m: [38774, 28561],
            randwrite_4k: [96244, 116004],
            randwrite_1m: [9171, 9402],
          }
        pairs: [docker, colima]
      caveats:
        - 'no quiet gate (Ezz: "no gate needed"); other sessions used Docker Desktop during the pass and only this pass used Colima, a bias against Docker Desktop'
        - 'load average 62.1 at the start, the peak of the pass'
        - 'one job per cell and round, so each round is one sample; bind randread 1m on Colima gave 545 then 2734 MiB/s'
  verdict: docker-faster
  verdict_reason: 'Docker leads on bind mounts (4k randwrite 40158 against 12677 IOPS, -68% on Colima; 1m randwrite -50%; 4k randread -13%) and on named volumes (1m randread -46%, 4k randwrite -32%); no Colima lead beyond the spread; the root filesystem ties'

- id: idle-memory
  name: host memory on 0, 1, 10 and 30 idle containers
  combination:
    engine:
      [
        docker,
        docker-vmm,
        colima,
        orbstack,
        'apple (paused until a socktainer release for container 1.7.1)',
      ]
    client: docker CLI against each engine socket
    workload: sleep infinity containers
  hypothesis: Apple has a small base and a cost per container; Docker has a large base and a small cost per container.
  measure: >-
    Summed RSS of each engine's host processes (ps -o rss of the VM and helper processes), plus footprint.
  expected: Apple wins at 0 and loses per container.
